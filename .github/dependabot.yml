version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    reviewers:
      - "CycloneDX/go-maintainers"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directory: "/"
    reviewers:
      - "CycloneDX/go-maintainers"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    reviewers:
      - "CycloneDX/go-maintainers"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"